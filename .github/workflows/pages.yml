# SPDX-License-Identifier: MIT
# The site (GitHub Pages): fm1-base's tools/make_site.py around a package (web installer, manual, emu/ = the WASM
# preview, firmware/), plus fm1-emu/ = that same package emulated (tools/site_emu.sh) and the project's own front page
# (tools/site_front.sh). Two ways in:
#   - a published release, or a manual run with a release tag: the attested release package is downloaded;
#   - a push to main, or a manual run without a tag: the package is built here (a development build, labelled "not
#     attested" on the page), so the site follows main.
name: Pages

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "a release tag (vX.Y) whose attested package the site carries; empty: build main here (development build)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DEV_VERSION: "0.2-dev"      # the version of a development build (build.py --release X.Y-suffix)

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || '' }}
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.20
      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq libfribidi0
          python3 -m pip install -q Pillow
          if [ -n "$TAG" ]; then
            # a release: its attested package
            version=${TAG#v}; kind=release
            mkdir -p build/release
            gh release download "$TAG" --pattern "stamp-$version.fwsc" --dir build/release
            cp "build/release/stamp-$version.fwsc" build/
          else
            # main: built here, the way release.yml does (JieLi toolchain, AC79 SDK at its pinned tag and commit)
            version=$DEV_VERSION; kind=dev
            mkdir -p "$RUNNER_TEMP/tc" && cd "$RUNNER_TEMP/tc"
            curl -fL --retry 3 https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ
            cd "$GITHUB_WORKSPACE"
            tc=$(find "$RUNNER_TEMP/tc" -maxdepth 1 -mindepth 1 -type d | head -n 1)
            sdk="$RUNNER_TEMP/ac79sdk"
            for i in 1 2 3 4; do
              rm -rf "$sdk"
              git clone -q --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$sdk" && break
              [ "$i" = 4 ] && { echo "SDK clone failed"; exit 1; }
              sleep $((i * 10))
            done
            test "$(git -C "$sdk" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
            python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
            JIELI_TOOLCHAIN="$tc" AC79_SDK="$sdk" ./build.sh --release "$version"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "KIND=$kind" >> "$GITHUB_ENV"
      - name: Site
        run: |
          set -euo pipefail
          # the screen reader's voice (fm1-reader: eSpeak NG, GPL, a separate program the page loads), pinned
          git clone -q https://github.com/charlesvestal/fm1-reader build/fm1-reader
          git -C build/fm1-reader -c advice.detachedHead=false checkout -q 10280f4
          FM1_READER="$PWD/build/fm1-reader/web" ./build.sh --web
          python3 base/tools/make_site.py . "build/stamp-$VERSION.fwsc" "$VERSION" build/site
          tools/site_emu.sh build/site "$VERSION"
          tools/site_front.sh build/site "$VERSION" "$KIND" "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
